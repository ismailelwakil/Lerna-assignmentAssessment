# /etc/nginx/sites-available/lerna
# Nginx reverse proxy with TLS — put your real domain + certs in place.
# Certbot: sudo certbot --nginx -d lerna.example.com

server {
    listen 80;
    server_name lerna.example.com;          # ← change me
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lerna.example.com;          # ← change me

    ssl_certificate     /etc/letsencrypt/live/lerna.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lerna.example.com/privkey.pem;

    client_max_body_size 30m;               # material uploads

    # ---- REST API → your frontend/platform ----
    location /api/ {
        proxy_pass http://127.0.0.1:8002/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;            # AI evaluation can take a while
    }

    # ---- API docs/health (restrict or remove in hardened setups) ----
    location ~ ^/(docs|openapi.json|health)$ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        # optionally: allow only your office/VPN IP
        # allow 203.0.113.10; deny all;
    }

    # ---- Streamlit testing UI ----
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;      # Streamlit websockets
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
}
